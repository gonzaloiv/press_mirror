<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4XGNNPMW2C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-4XGNNPMW2C');
    </script>
</head>

<body>
    <main class="container">
        {% include "_header.html" %}

        <nav class="date-pagination" aria-label="Browse snapshot dates">
            {% if older_url %}
            <a class="older-day" href="{{ older_url }}" rel="next">← Older day</a>
            {% else %}
            <span></span>
            {% endif %}
            <div class="date-info">
                <time datetime="{{ selected_date }}">{{ date_label }}</time>
                {% if ingestion_time %}
                <time class="ingestion-time" datetime="{{ ingestion_time }}">Collected {{ ingestion_time_label }}</time>
                {% endif %}
            </div>
            {% if newer_url %}
            <a class="newer-day" href="{{ newer_url }}" rel="prev">Newer day →</a>
            {% else %}
            <span></span>
            {% endif %}
        </nav>

        <section class="story-grid" aria-label="Top stories for {{ date_label }}">
            {% for card in cards %}
            <a class="card" href="{{ card.map_url }}">
                <img src="{{ card.image_path }}" alt="">
            </a>
            {% endfor %}
        </section>

        {% include "_footer.html" %}
    </main>
    <script src="{{ url_for('static', filename='js/home.js') }}" defer></script>
</body>

</html>
