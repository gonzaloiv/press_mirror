<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>News Comparison</title>
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.25rem;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 2rem;
            font-size: 0.95rem;
        }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            color: inherit;
            text-decoration: none;
        }

        .card:hover .headline {
            text-decoration: underline;
        }

        .card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #f3f4f6;
        }

        .card-content {
            padding: 1rem;
        }

        .card .headline {
            font-weight: 600;
            line-height: 1.35;
        }

        .codes {
            margin-top: 0.5rem;
            color: var(--muted);
            font-size: 0.85rem;
        }

    </style>
</head>

<body>
    <div class="container">
        <h1>News Comparison</h1>
        <p class="subtitle">Top stories covered across multiple countries.</p>

        <div class="story-grid">
            {% for c in clusters[:6] %}
            <a class="card" href="/map/{{ loop.index0 }}">
                <img src="/static/maps/{{ maps_date }}/{{ loop.index0 }}_small.png" alt="">
                <div class="card-content">
                    <div class="headline">{{ c.label }}</div>
                    <div class="codes">{{ c.countries|join(" · ") }}</div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>

</html>
