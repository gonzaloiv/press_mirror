<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Press Mirror</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/grid.css') }}">
</head>

<body>
    <main class="container">
        <header>
            <h1>The Press Mirror</h1>
            <p class="tagline">European coverage of world news, seen from every country that covered it.</p>
        </header>

        <section class="story-grid" aria-label="Today's top stories">
            {% for card in cards %}
            <a class="card" href="/map/{{ card.index }}">
                <img src="{{ card.image_path }}" alt="">
            </a>
            {% endfor %}
        </section>
    </main>
</body>

</html>
