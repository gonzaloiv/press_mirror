<!DOCTYPE html>
<html lang="{{ language }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ about_title }} — {{ app_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
            color: #17212b;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 17px;
            line-height: 1.65;
        }

        .home-link {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            line-height: normal;
            margin-bottom: 16px;
            padding: 0.5rem 0.9rem;
            border: 1px solid #b7c4d3;
            border-radius: 999px;
            background: #f3f6fa;
            color: #003399;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
        }

        .home-link:hover {
            border-color: #003399;
            background: #003399;
            color: #ffffff;
        }

        .home-link:focus-visible {
            outline: 3px solid #003399;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .home-link {
                transition: none;
            }
        }

        h1 {
            margin: 1.5rem 0 2rem;
            font-size: 2rem;
            line-height: 1.2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        section+section {
            margin-top: 2rem;
        }

        h2 {
            margin: 0 0 0.75rem;
            font-size: 1.25rem;
            line-height: 1.35;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        p {
            margin: 0 0 1rem;
        }

        ul {
            margin: 0 0 1rem;
            padding-left: 1.5rem;
        }

        li+li {
            margin-top: 0.35rem;
        }

        .about-sources {
            columns: 2;
            column-gap: 2.5rem;
            margin: 0 0 1rem;
            padding: 0;
            list-style: none;
        }

        .about-sources li {
            break-inside: avoid;
            margin: 0 0 0.75rem;
        }

        .about-sources li+li {
            margin-top: 0;
        }

        .about-source-country {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .about-source-outlets {
            color: #667382;
        }

        .about-source-outlets a {
            color: inherit;
            text-decoration: none;
        }

        .about-source-outlets a:hover,
        .about-source-outlets a:focus-visible {
            color: #17212b;
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            .about-sources {
                columns: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4XGNNPMW2C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-4XGNNPMW2C');
    </script>
</head>

<body>
    <a class="home-link" href="{{ eurl('index') }}">{{ strings.home_link }}</a>
    <main>
        <h1>{{ about_title }}</h1>

        {% for section in about_sections %}
        <section>
            <h2>{{ section.heading }}</h2>
            {% for block in section.blocks %}{% if block %}{{ block|safe }}{% endif %}{% endfor %}
        </section>
        {% endfor %}

        {% set hide_footer_about_link = true %}
        {% include "_footer.html" %}
    </main>
</body>

</html>
